name: Flutter app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'
  # Publishable (client) values only; they ship inside every app build. Never put the secret key here.
  DEFAULT_SUPABASE_URL: 'https://yadupzdfdhlzrrsijbuv.supabase.co'
  DEFAULT_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_NObrw9Ej4sdDhNJCODcIDQ_G8gpwmSK'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Write Supabase build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || env.DEFAULT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Pasted secrets often carry spaces or line breaks, which split the compiler command.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]"')
          key=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]"')
          url=${url#SUPABASE_URL=}
          key=${key#SUPABASE_PUBLISHABLE_KEY=}
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9-]+\.supabase\.co/?$'; then
            echo "::error::SUPABASE_URL must look like https://<project>.supabase.co. Fix or delete the secret."
            exit 1
          fi
          case "$key" in
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY holds a SECRET key. Use the sb_publishable_ key and rotate the secret key."; exit 1 ;;
            sb_publishable_*|eyJ*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_. Fix or delete the secret."; exit 1 ;;
          esac
          jq -n --arg url "${url%/}" --arg key "$key" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > dart_defines.json

      - run: flutter pub get

      - name: Build
        run: |
          set +e
          flutter build web --release \
            --dart-define-from-file=dart_defines.json \
            --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          rm -f dart_defines.json
          if [ "$status" -ne 0 ]; then
            echo "::error title=flutter build web failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit "$status"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Write Supabase build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || env.DEFAULT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Pasted secrets often carry spaces or line breaks, which split the compiler command.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]"')
          key=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]"')
          url=${url#SUPABASE_URL=}
          key=${key#SUPABASE_PUBLISHABLE_KEY=}
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9-]+\.supabase\.co/?$'; then
            echo "::error::SUPABASE_URL must look like https://<project>.supabase.co. Fix or delete the secret."
            exit 1
          fi
          case "$key" in
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY holds a SECRET key. Use the sb_publishable_ key and rotate the secret key."; exit 1 ;;
            sb_publishable_*|eyJ*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_. Fix or delete the secret."; exit 1 ;;
          esac
          jq -n --arg url "${url%/}" --arg key "$key" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > dart_defines.json

      - run: flutter pub get

      - name: Build
        run: |
          set +e
          flutter build apk --release \
            --dart-define-from-file=dart_defines.json \
            --build-number ${{ github.run_number }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          rm -f dart_defines.json
          if [ "$status" -ne 0 ]; then
            echo "::error title=flutter build apk failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit "$status"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: netsu-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netsu-android-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          generate_release_notes: true
